name: quality

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'chore/**', 'ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./backend
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/check_import_boundaries.py
      - run: python -m build --no-isolation ./backend
      - name: Import built wheel away from repository
        run: |
          python -m pip install --force-reinstall --no-deps backend/dist/*.whl
          cd /tmp
          python -I -c "import study_supporter; from study_supporter.ai.retrieval.rrf import reciprocal_rank_fusion; assert reciprocal_rank_fusion([], []) == {}"

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-test-only
          POSTGRES_DB: p0_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fixture -d p0_test'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://fixture:fixture-test-only@localhost:5432/p0_test
      P0_TEST_DATABASE_URL: postgresql+psycopg2://fixture:fixture-test-only@localhost:5432/p0_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation --no-deps -e ./backend
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m alembic -c backend/alembic.ini check
      - run: python -m pytest backend/tests/integration -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: self-study-supporter:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Compose and functional smoke without models
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker config --quiet
          docker compose --env-file .env.docker up -d --no-build --wait
          curl --fail http://localhost:8501/_stcore/health
          docker compose --env-file .env.docker exec -T app python -m scripts.docker_smoke seed
          docker compose --env-file .env.docker exec -T app python -m scripts.streamlit_smoke
          docker compose --env-file .env.docker restart app db
          docker compose --env-file .env.docker up -d --no-build --wait
          docker compose --env-file .env.docker exec -T app python -m scripts.docker_smoke verify
      - name: Redacted diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.docker ps -a
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --env-file .env.docker down

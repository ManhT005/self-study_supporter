target-version = "py311"
line-length = 100
include = ["apps/**/*.py", "backend/src/**/*.py", "backend/tests/**/*.py", "backend/migrations/**/*.py", "scripts/**/*.py", "evaluation/**/*.py", "main.py", "eval_test.py"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Entrypoint loads dotenv and sets Streamlit page configuration before adapters.
"apps/streamlit_legacy/main.py" = ["E402"]

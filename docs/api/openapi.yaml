openapi: 3.1.0
info:
  title: Self Study Supporter retrieval contract (P1 proposal)
  version: 0.0.0
  description: Design contract only; no HTTP implementation in P0.
paths:
  /api/retrieval:
    post:
      operationId: retrieveEvidence
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [document_ids, question]
              properties:
                document_ids:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
                question: {type: string, minLength: 1}
                top_k: {type: integer, minimum: 1, default: 5}
      responses:
        '200':
          description: Evidence from documents owned by authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [evidence]
                properties:
                  evidence:
                    type: array
                    items: {$ref: '#/components/schemas/Evidence'}
        '401': {description: Authentication required}
        '404': {description: Document unavailable}
        '422': {description: Invalid input}
        '429': {description: Quota exceeded}
        '503': {description: Provider unavailable}
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Proposed transport; actual auth design finalized in P1.
  schemas:
    Evidence:
      type: object
      required: [document_id, chunk_id, text, source, page_start, page_end]
      properties:
        document_id: {type: string}
        chunk_id: {type: string}
        text: {type: string}
        source: {type: string}
        page_start: {type: [integer, 'null'], minimum: 1}
        page_end: {type: [integer, 'null'], minimum: 1}
        score: {type: [number, 'null']}
